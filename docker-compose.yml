version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: farmers_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./farmer-direct sales/backend
      dockerfile: Dockerfile
    container_name: farmers_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/farmers_market
      - JWT_SECRET=changeme
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
