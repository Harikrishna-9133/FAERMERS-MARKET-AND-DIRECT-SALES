<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Dashboard</title>

<style>

body{
font-family: Arial;
background:#f4f6f5;
margin:0;
}

header{
background:#1565c0;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

button{
padding:10px 20px;
border:none;
background:#d32f2f;
color:white;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<header>
<h2>🛒 Customer Dashboard</h2>
<button id="logoutBtn">Logout</button>
</header>

<div class="container">

<div class="card">
<h3>Welcome Customer</h3>
<p>Browse fresh products from farmers.</p>
</div>

<div class="card">
<h3>Products</h3>
<p>This page will soon show farmer products.</p>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
